<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qmedstudy - Login</title>
    <link rel="icon" type="image/png" href="logo.png" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Inter Font & FontAwesome -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div
      class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 md:p-8 relative overflow-hidden"
    >
      <!-- Logo & Header -->
      <div class="text-center mb-8">
        <!-- عرض اللوجو بحجم مناسب في المنتصف -->
        <img
          src="./logo.png"
          alt="Qmedstudy Logo"
          class="h-20 md:h-24 w-auto object-contain mx-auto mb-4 drop-shadow-md"
        />
        <h2 id="form-title" class="text-2xl font-bold text-slate-800">
          Welcome Back
        </h2>
        <p id="form-subtitle" class="text-sm text-slate-500 mt-2">
          Please enter your details to sign in.
        </p>
      </div>

      <!-- Alert Box (Hidden by default) -->
      <div
        id="alert-box"
        class="hidden mb-4 p-3 rounded-lg text-sm font-medium flex items-start gap-2"
      >
        <i id="alert-icon" class="fa-solid mt-0.5"></i>
        <span id="alert-text"></span>
      </div>

      <!-- Auth Form -->
      <form id="auth-form" class="space-y-4">
        <!-- Full Name (Hidden in Login) -->
        <div id="name-group" class="hidden">
          <label class="block text-sm font-medium text-slate-700 mb-1"
            >Full Name</label
          >
          <input
            type="text"
            id="full-name"
            class="w-full border border-slate-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
            placeholder="Dr. Ahmed Mahmoud"
          />
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1"
            >Email Address</label
          >
          <input
            type="email"
            id="email"
            required
            class="w-full border border-slate-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
            placeholder="doctor@example.com"
          />
        </div>

        <!-- Mobile Number (Hidden in Login) -->
        <div id="mobile-group" class="hidden">
          <label class="block text-sm font-medium text-slate-700 mb-1"
            >Mobile Number</label
          >
          <input
            type="tel"
            id="mobile-number"
            class="w-full border border-slate-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
            placeholder="010XXXXXXXX"
          />
        </div>

        <!-- University (Hidden in Login) -->
        <div id="university-group" class="hidden">
          <label class="block text-sm font-medium text-slate-700 mb-1"
            >University / Hospital</label
          >
          <input
            type="text"
            id="university-name"
            class="w-full border border-slate-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
            placeholder="Cairo University"
          />
        </div>

        <!-- Password -->
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1"
            >Password</label
          >
          <div class="relative">
            <input
              type="password"
              id="password"
              required
              minlength="6"
              class="w-full border border-slate-300 rounded-lg px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
              placeholder="••••••••"
            />
            <button
              type="button"
              id="toggle-password"
              class="absolute right-3 top-3 text-slate-400 hover:text-slate-600"
            >
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="submit-btn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors flex items-center justify-center gap-2 mt-6"
        >
          <span id="btn-text">Sign In</span>
          <i id="btn-spinner" class="fa-solid fa-spinner fa-spin hidden"></i>
        </button>
      </form>

      <!-- Toggle Mode -->
      <div class="mt-6 text-center text-sm text-slate-600">
        <span id="toggle-text">Don't have an account?</span>
        <button
          id="toggle-mode-btn"
          class="text-blue-600 font-semibold hover:underline ml-1"
        >
          Sign up
        </button>
      </div>

      <!-- Contact Support -->
      <div class="mt-8 pt-5 border-t border-slate-100">
        <p class="text-xs text-center text-slate-500 mb-3 font-medium">
          تواجه مشكلة في تسجيل الدخول؟ تواصل مع الدعم الفني
        </p>
        <div class="flex justify-center gap-3">
          <a
            href="https://wa.me/201092022513"
            target="_blank"
            class="flex items-center gap-2 px-4 py-2 bg-[#25D366]/10 text-[#25D366] hover:bg-[#25D366] hover:text-white rounded-xl transition-colors text-sm font-bold shadow-sm"
          >
            <i class="fa-brands fa-whatsapp text-lg"></i> WhatsApp
          </a>
          <a
            href="https://t.me/YOUR_TELEGRAM_LINK"
            target="_blank"
            class="flex items-center gap-2 px-4 py-2 bg-[#229ED9]/10 text-[#229ED9] hover:bg-[#229ED9] hover:text-white rounded-xl transition-colors text-sm font-bold shadow-sm"
          >
            <i class="fa-brands fa-telegram text-lg"></i> Telegram
          </a>
        </div>
      </div>
    </div>

    <script>
      // 1. Supabase Config
      const supabaseUrl = "https://tteswqndzfmnakuxzjyy.supabase.co";
      const supabaseKey = "sb_publishable_6ITKD07eDwp45N5nIvTeew_QgNL6l3D";
      const client = supabase.createClient(supabaseUrl, supabaseKey);

      // 2. DOM Elements
      const form = document.getElementById("auth-form");
      const formTitle = document.getElementById("form-title");
      const formSubtitle = document.getElementById("form-subtitle");
      const submitBtnText = document.getElementById("btn-text");
      const toggleModeBtn = document.getElementById("toggle-mode-btn");
      const toggleText = document.getElementById("toggle-text");
      const btnSpinner = document.getElementById("btn-spinner");
      const submitBtn = document.getElementById("submit-btn");
      const togglePasswordBtn = document.getElementById("toggle-password");
      const passwordInput = document.getElementById("password");

      // Extra Fields for Sign Up
      const nameGroup = document.getElementById("name-group");
      const mobileGroup = document.getElementById("mobile-group");
      const universityGroup = document.getElementById("university-group");
      const fullNameInput = document.getElementById("full-name");
      const mobileInput = document.getElementById("mobile-number");
      const universityInput = document.getElementById("university-name");

      // Alert Box
      const alertBox = document.getElementById("alert-box");
      const alertIcon = document.getElementById("alert-icon");
      const alertText = document.getElementById("alert-text");

      let isLoginMode = true;

      // 3. Toggle Password Visibility
      togglePasswordBtn.addEventListener("click", () => {
        const type =
          passwordInput.getAttribute("type") === "password"
            ? "text"
            : "password";
        passwordInput.setAttribute("type", type);
        togglePasswordBtn.innerHTML =
          type === "password"
            ? '<i class="fa-solid fa-eye"></i>'
            : '<i class="fa-solid fa-eye-slash"></i>';
      });

      // 4. Toggle between Login and Sign Up
      toggleModeBtn.addEventListener("click", (e) => {
        e.preventDefault();
        isLoginMode = !isLoginMode;
        alertBox.classList.add("hidden"); // Clear alerts

        if (isLoginMode) {
          formTitle.textContent = "Welcome Back";
          formSubtitle.textContent = "Please enter your details to sign in.";
          submitBtnText.textContent = "Sign In";
          toggleText.textContent = "Don't have an account?";
          toggleModeBtn.textContent = "Sign up";

          // Hide extra fields and remove 'required'
          nameGroup.classList.add("hidden");
          mobileGroup.classList.add("hidden");
          universityGroup.classList.add("hidden");
          fullNameInput.required = false;
          mobileInput.required = false;
          universityInput.required = false;
        } else {
          formTitle.textContent = "Create an Account";
          formSubtitle.textContent = "Join Qmedstudy to start practicing.";
          submitBtnText.textContent = "Create Account";
          toggleText.textContent = "Already have an account?";
          toggleModeBtn.textContent = "Sign in";

          // Show extra fields and add 'required'
          nameGroup.classList.remove("hidden");
          mobileGroup.classList.remove("hidden");
          universityGroup.classList.remove("hidden");
          fullNameInput.required = true;
          mobileInput.required = true;
          universityInput.required = true;
        }
      });

      // 5. Show Alerts
      function showAlert(message, type = "error") {
        alertBox.classList.remove(
          "hidden",
          "bg-red-50",
          "text-red-600",
          "bg-green-50",
          "text-green-600",
          "bg-blue-50",
          "text-blue-600",
        );
        if (type === "error") {
          alertBox.classList.add("bg-red-50", "text-red-700");
          alertIcon.className = "fa-solid fa-triangle-exclamation mt-0.5";
        } else if (type === "success") {
          alertBox.classList.add("bg-green-50", "text-green-700");
          alertIcon.className = "fa-solid fa-circle-check mt-0.5";
        } else {
          alertBox.classList.add("bg-blue-50", "text-blue-700");
          alertIcon.className = "fa-solid fa-circle-info mt-0.5";
        }
        alertText.textContent = message;
      }

      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        if (isLoading) {
          btnSpinner.classList.remove("hidden");
          submitBtn.classList.add("opacity-70", "cursor-not-allowed");
        } else {
          btnSpinner.classList.add("hidden");
          submitBtn.classList.remove("opacity-70", "cursor-not-allowed");
        }
      }

      // 6. Handle Form Submit
      // 6. Handle Form Submit with Dynamic Disposable Email Blocker
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        setLoading(true);
        alertBox.classList.add("hidden");

        const email = document.getElementById("email").value;
        const password = passwordInput.value;
        const emailDomain = email.split("@")[1].toLowerCase();

        // --- 1. فحص الإيميل الوهمي ---
        let blockedDomains = [
          "tempmail.com",
          "mohmal.com",
          "mailinator.com",
          "guerrillamail.com",
          "yopmail.com",
        ];
        try {
          const response = await fetch(
            "https://raw.githubusercontent.com/ivolo/disposable-email-domains/master/index.json",
          );
          if (response.ok) {
            blockedDomains = await response.json();
          }
        } catch (fetchError) {
          console.warn(
            "Could not fetch the full disposable domains list. Using fallback list.",
          );
        }

        if (blockedDomains.includes(emailDomain)) {
          showAlert(
            "Disposable/Temp emails are not allowed. Please use a real email address.",
            "error",
          );
          setLoading(false);
          return;
        }
        // -----------------------------

        try {
          if (isLoginMode) {
            // --- LOGIN LOGIC ---
            const { data: authData, error: authError } =
              await client.auth.signInWithPassword({
                email: email,
                password: password,
              });

            if (authError) throw authError;

            // 1. توليد أو جلب بصمة الجهاز من المتصفح
            let localDeviceId = localStorage.getItem("qmedstudy_device_id");
            if (!localDeviceId) {
              // إذا لم يكن له بصمة، ننشئ بصمة فريدة ونحفظها في المتصفح
              localDeviceId =
                "dev_" +
                Math.random().toString(36).substr(2, 9) +
                "_" +
                Date.now();
              localStorage.setItem("qmedstudy_device_id", localDeviceId);
            }

            // 2. التحقق من البصمة المحفوظة في قاعدة البيانات
            const { data: profile, error: profileErr } = await client
              .from("profiles")
              .select("device_id, role")
              .eq("id", authData.session.user.id)
              .single();

            if (profileErr) throw profileErr;

            // نستثني الإدمن من هذا الشرط لكي يدخل من أي جهاز براحته
            if (profile.role !== "admin") {
              if (!profile.device_id) {
                // أول تسجيل دخول: نربط الحساب بهذا الجهاز
                await client
                  .from("profiles")
                  .update({ device_id: localDeviceId })
                  .eq("id", authData.session.user.id);
              } else if (profile.device_id !== localDeviceId) {
                // الحساب مربوط بجهاز آخر!
                await client.auth.signOut(); // تسجيل خروج إجباري
                showAlert(
                  "عفواً، هذا الحساب مربوط بجهاز آخر. لا يمكن تسجيل الدخول من أجهزة متعددة.",
                  "error",
                );
                setLoading(false);
                return; // إيقاف العملية
              }
            }

            showAlert("Login successful! Redirecting...", "success");

            setTimeout(() => {
              window.location.href = "app.html"; // تأكد من اسم ملف المنصة الخاص بك
            }, 1000);
          } else {
            // --- SIGN UP LOGIC ---
            const fullName = fullNameInput.value;
            const mobileNumber = mobileInput.value;
            const universityName = universityInput.value;

            const { data, error } = await client.auth.signUp({
              email: email,
              password: password,
              options: {
                data: {
                  full_name: fullName,
                  mobile_number: mobileNumber,
                  university_name: universityName,
                },
              },
            });

            if (error) throw error;

            // تم التعديل هنا: التسجيل الناجح ينقل الطالب مباشرة للمنصة
            showAlert(
              "Account created successfully! Redirecting...",
              "success",
            );

            setTimeout(() => {
              window.location.href = "app.html";
            }, 1000);
          }
        } catch (err) {
          showAlert(err.message || "An error occurred.", "error");
        } finally {
          setLoading(false);
        }
      });
    </script>
  </body>
</html>
